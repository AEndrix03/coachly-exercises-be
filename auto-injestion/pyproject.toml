[project]
name = "exercise-enrichment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pydantic-settings", "psycopg[binary]", "httpx", "tenacity", "typer", "rich", "pyyaml", "orjson", "jsonschema", "tree-sitter", "tree-sitter-java", "numpy", "scikit-learn", "rapidfuzz", "jinja2", "networkx"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["exercise_enrichment"]

[tool.ruff]
line-length = 100
